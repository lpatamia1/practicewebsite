<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Study Hub</title>
    <script src="https://cdn-tailwindcss.vercel.app/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* -- Card flip animation -- */
        .card-container {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s;
            transform-style: preserve-3d;
        }
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2.5rem;
            border-radius: 1rem; /* 16px */
        }
        .card-front {
            background-color: #fdfaf2; /* Cream paper */
            color: #333;
            border: 1px solid #e0dccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            font-family: 'Special Elite', monospace;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: #fdfaf2;
            color: #2c5282; /* Blue ink */
            border: 1px solid #e0dccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            font-family: 'Special Elite', monospace;
            /* Ruled lines */
            background-image: repeating-linear-gradient(#fdfaf2, #fdfaf2 29px, #d1e3f3 30px, #d1e3f3 31px);
            text-align: left;
            align-items: flex-start; /* top align */
            justify-content: flex-start; /* left align */
            line-height: 31px; /* Match repeating gradient */
        }
        #card-definition {
             padding-top: 15px; /* Align text with first line */
        }
         /* Custom scrollbar for definition */
        .definition-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .definition-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .definition-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        .definition-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        /* Syntax Highlighting */
        pre code.hljs {
            border-radius: 0.75rem;
            padding: 1.5rem !important;
        }
        /* Gamification Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(22, 163, 74, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
        }
        .pulse {
            animation: pulse 0.6s ease-out;
        }

        /* Study Buddy Styles */
        #study-buddy-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        #study-buddy {
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #study-buddy:hover {
            transform: scale(1.1);
        }
        #speech-bubble {
            position: absolute;
            bottom: 110px; /* Above the buddy */
            right: 0;
            background-color: #1e293b; /* slate-800 */
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            width: max-content;
            max-width: 200px;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            visibility: hidden;
            border: 1px solid #334155; /* slate-700 */
        }
        #speech-bubble.show {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }
        /* Speech bubble tail */
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 30px;
            border-width: 10px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }
        
        /* Buddy animations */
        @keyframes buddy-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .buddy-happy {
            animation: buddy-bounce 0.5s ease-in-out;
        }
        @keyframes buddy-encourage {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        .buddy-encourage {
             animation: buddy-encourage 0.6s ease-in-out;
        }

    </style>
</head>
<body class="bg-slate-900 text-white h-full flex items-center justify-center p-4 antialiased">

        <div class="w-full flex items-center justify-between mt-2">

        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA ---
            const flashcards = [
                { term: "JVM", definition: "Java Virtual Machine. An abstract machine that enables a computer to run a Java program.", mastered: false },
                { term: "JDK", definition: "Java Development Kit. A software development environment used for developing Java applications.", mastered: false },
                { term: "JRE", definition: "Java Runtime Environment. The part of the JDK that contains the JVM, class libraries, and other files.", mastered: false },
                { term: "Garbage Collection", definition: "The automated process of managing memory. It frees up memory that is no longer in use.", mastered: false },
                { term: "Class", definition: "A blueprint for creating objects. It defines a set of properties and methods.", mastered: false },
                { term: "Object", definition: "An instance of a class, consisting of data (fields) and methods.", mastered: false },
                { term: "Encapsulation", definition: "Bundling data and methods that operate on the data into a single unit (a class).", mastered: false },
                { term: "Inheritance", definition: "A mechanism where a new class derives properties and behaviors from an existing class.", mastered: false },
                { term: "Polymorphism", definition: "The ability of an object to take on many forms, often through method overriding.", mastered: false },
                { term: "Abstraction", definition: "Hiding complex implementation details and showing only essential features of an object.", mastered: false },
                { term: "Interface", definition: "An abstract type used to specify a behavior that classes must implement. Since Java 8, they can contain default and static methods.", mastered: false },                { term: "Constructor", definition: "A special method used to initialize objects. It is called when an object of a class is created.", mastered: false },
                { term: "Exception", definition: "An event that occurs during the execution of a program that disrupts the normal flow of instructions.", mastered: false },
                { term: "ArrayList", definition: "A resizable array, which can be found in the java.util package.", mastered: false },
                { term: "Static", definition: "A keyword that indicates a member variable or method can be accessed without requiring an instantiation of the class.", mastered: false },
                { term: "Final", definition: "A keyword used to declare constants, prevent method overriding, and inheritance of classes.", mastered: false },
                { term: "Lambda Expression", definition: "A short block of code which takes in parameters and returns a value. Used primarily to define inline implementations of functional interfaces.", mastered: false },
                { term: "Stream API", definition: "A powerful feature for processing sequences of elements (like collections) in a functional style.", mastered: false },
                { term: "Generics", definition: "A feature that allows you to define classes, interfaces, and methods with a placeholder for the type of data they operate on.", mastered: false },

                answer: "31"

                { question: "What is the parent class of all Java classes?", 
                code: null,

            // --- STATE ---
            let currentMode = 'flashcard';
            let currentFlashcardIndex = 0;

            // New state for matching game
            let firstCard, secondCard;
            let lockBoard = false;
            let matchedPairs = 0;

            let matchSeconds = 0;

            // --- DOM ELEMENTS ---
            const subtitle = document.getElementById('subtitle');
            const flashcardModeBtn = document.getElementById('flashcard-mode-btn');
            const quizModeBtn = document.getElementById('quiz-mode-btn');
            
            const flashcardView = document.getElementById('flashcard-view');
            const cardContainer = document.getElementById('card-container');
            const cardTerm = document.getElementById('card-term');
            const cardDefinition = document.getElementById('card-definition');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const progressIndicator = document.getElementById('progress-indicator');
            const masteryBtn = document.getElementById('mastery-btn');
            const masteryBtnText = document.getElementById('mastery-btn-text');
            const masteryIconCheck = document.getElementById('mastery-icon-check');
            const masteryIconStar = document.getElementById('mastery-icon-star');
            const masteryCountEl = document.getElementById('mastery-count');
            const masteryProgressBar = document.getElementById('mastery-progress-bar');
            
            const quizView = document.getElementById('quiz-view');
            const quizQuestionText = document.getElementById('quiz-question-text');
            const quizCodeSnippet = document.getElementById('quiz-code-snippet');
            const quizOptions = document.getElementById('quiz-options');
            const nextQuizBtn = document.getElementById('next-quiz-btn');
            const quizProgressIndicator = document.getElementById('quiz-progress-indicator');
            const quizQuestionContainer = document.getElementById('quiz-question-container');
            const quizResultsContainer = document.getElementById('quiz-results-container');
            const quizScoreEl = document.getElementById('quiz-score');
            const quizFeedbackEl = document.getElementById('quiz-feedback');
            const restartQuizBtn = document.getElementById('restart-quiz-btn');
            const streakCountEl = document.getElementById('streak-count');
            // New elements for matching game
            const matchingView = document.getElementById('matching-view');
            const matchTurnsEl = document.getElementById('match-turns');
            const matchTimerEl = document.getElementById('match-timer');
            const restartMatchBtn = document.getElementById('restart-match-btn');
            // Study Buddy elements
            const studyBuddy = document.getElementById('study-buddy');
            const speechBubble = document.getElementById('speech-bubble');

            // --- STUDY BUDDY LOGIC ---
            function showBuddyMessage(message, type = 'info', duration = 3000) {
                clearTimeout(buddyMessageTimeout);
                speechBubble.textContent = message;
                speechBubble.classList.add('show');
                
                studyBuddy.classList.remove('buddy-happy', 'buddy-encourage');
                
                if (type === 'success') {
                    studyBuddy.classList.add('buddy-happy');
                } else if (type === 'encourage') {
                    studyBuddy.classList.add('buddy-encourage');
                }

                buddyMessageTimeout = setTimeout(() => {
                    speechBubble.classList.remove('show');
                    studyBuddy.classList.remove('buddy-happy', 'buddy-encourage');
                }, duration);
            }
            
            // --- SHUFFLE FUNCTION ---
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];    
                }
                return array;
            }

            // --- MODE SWITCHING LOGIC ---
            function switchMode(mode) {
                if (currentMode === mode) return;
                currentMode = mode;
                if (mode === 'flashcard') {
                    flashcardView.classList.remove('hidden');
                    quizView.classList.add('hidden');
                    flashcardModeBtn.classList.add('bg-blue-500', 'text-white');
                    flashcardModeBtn.classList.remove('text-slate-400', 'hover:bg-slate-700/50');
                    quizModeBtn.classList.remove('bg-blue-500', 'text-white');
                    quizModeBtn.classList.add('text-slate-400', 'hover:bg-slate-700/50');
                    subtitle.textContent = "Click the card to reveal the definition.";
                    initFlashcards();
                    showBuddyMessage("Let's review some cards!");
                } else if (mode === 'quiz') {
                    flashcardView.classList.add('hidden');
                    quizView.classList.remove('hidden');
                    quizModeBtn.classList.add('bg-blue-500', 'text-white');
                    quizModeBtn.classList.remove('text-slate-400', 'hover:bg-slate-700/50');
                    flashcardModeBtn.classList.remove('bg-blue-500', 'text-white');
                    flashcardModeBtn.classList.add('text-slate-400', 'hover:bg-slate-700/50');
                    subtitle.textContent = "Test your knowledge with code examples.";
                    initQuiz();
                    showBuddyMessage("Quiz time! Good luck!");
                } else if (mode === 'matching') {
                    // Future implementation for matching mode
                    matchingView.classList.remove('hidden');
                    matchingModeBtn.classList.add('bg-blue-700', 'text-white');
                    subtitle.textContent = "Find the matching pairs.";
                    initMatchingGame();                }
            }
            // --- MATCHING LOGIC ---
            function initMatchingGame() {
                const grid = document.getElementById('match-grid');
                grid.innerHTML = '';
                
                // Reset game state
                matchTurns = 0;
                matchedPairs = 0;
                matchSeconds = 0;
                matchTurnsEl.textContent = 0;
                resetBoard();
                startMatchTimer();

                const gameCardsData = [...flashcards].sort(() => 0.5 - Math.random()).slice(0, 8);
                const gamePairs = [];
                gameCardsData.forEach(card => {
                    gamePairs.push({ content: card.term, key: card.term });
                    gamePairs.push({ content: card.definition, key: card.term });
                });
                shuffleArray(gamePairs);

                gamePairs.forEach(pair => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'card-container h-28 cursor-pointer'; // Smaller card
                    cardElement.dataset.key = pair.key;

                    cardElement.innerHTML = `
                        <div class="card-inner">
                            <div class="card-front bg-slate-700 border border-slate-600"></div>
                            <div class="card-back !text-xs !p-2 !leading-tight !text-left overflow-y-auto definition-scroll">
                                ${pair.content}
                            </div>
                        </div>
                    `;
                    cardElement.addEventListener('click', handleMatchCardClick);
                    grid.appendChild(cardElement);
                });
            }

            function handleMatchCardClick() {
                if (lockBoard) return;
                if (this === firstCard) return;

                this.classList.add('flipped');

                if (!firstCard) {
                    firstCard = this;
                    return;
                }

                secondCard = this;
                lockBoard = true;
                matchTurns++;
                matchTurnsEl.textContent = matchTurns;

                checkForMatch();
            }

            function checkForMatch() {
                const isMatch = firstCard.dataset.key === secondCard.dataset.key;
                isMatch ? disableCards() : unflipCards();
            }

            function disableCards() {
                firstCard.removeEventListener('click', handleMatchCardClick);
                secondCard.removeEventListener('click', handleMatchCardClick);
                matchedPairs++;
                
                if (matchedPairs === 8) { // Game over condition
                    stopMatchTimer();
                    showBuddyMessage(`You did it in ${matchTurns} turns!`, 'success');
                }
                resetBoard();
            }

            function unflipCards() {
                setTimeout(() => {
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');
                    resetBoard();
                }, 1200);
            }

            function resetBoard() {
                [firstCard, secondCard] = [null, null];
                lockBoard = false;
            }

            function startMatchTimer() {
                stopMatchTimer(); // Clear any existing timer
                matchTimerInterval = setInterval(() => {
                    matchSeconds++;
                    const minutes = String(Math.floor(matchSeconds / 60)).padStart(2, '0');
                    const seconds = String(matchSeconds % 60).padStart(2, '0');
                    matchTimerEl.textContent = `${minutes}:${seconds}`;
                }, 1000);
            }

            function stopMatchTimer() {
                clearInterval(matchTimerInterval);
            }
            // --- FLASHCARD LOGIC ---
            function initFlashcards() {
                shuffleArray(flashcards);
                currentFlashcardIndex = 0;
                updateFlashcard();
                updateMasteryProgress();
            }

            function updateFlashcard() {
                const currentCard = flashcards[currentFlashcardIndex];
                cardTerm.textContent = currentCard.term;
                cardDefinition.textContent = currentCard.definition;
                if (cardContainer.classList.contains('flipped')) {
                    cardContainer.classList.remove('flipped');
                }
                updateFlashcardProgress();
                updateMasteryButton();
            }
            
            function toggleMastery() {
                const card = flashcards[currentFlashcardIndex];
                card.mastered = !card.mastered;
                if(card.mastered){
                    showBuddyMessage("Nice! One down.", "success");
                }
                updateMasteryButton();
                updateMasteryProgress();
                saveProgress();
            }

            function updateMasteryButton() {
                const card = flashcards[currentFlashcardIndex];
                if (card.mastered) {
                    masteryBtnText.textContent = "Mastered!";
                    masteryBtn.classList.add('text-pink-400');
                    masteryIconCheck.classList.add('hidden');
                    masteryIconStar.classList.remove('hidden');
                } else {
                    masteryBtnText.textContent = "Mark as Mastered";
                    masteryBtn.classList.remove('text-pink-400');
                    masteryIconCheck.classList.remove('hidden');
                    masteryIconStar.classList.add('hidden');
                }
            }
            
            function updateMasteryProgress() {
                const masteredCount = flashcards.filter(card => card.mastered).length;
                const totalCards = flashcards.length;
                masteryCountEl.textContent = `${masteredCount}/${totalCards} Mastered`;
                const percentage = (masteredCount / totalCards) * 100;
                masteryProgressBar.style.width = `${percentage}%`;
            }

            function updateFlashcardProgress() {
                progressIndicator.textContent = `${currentFlashcardIndex + 1} / ${flashcards.length}`;
                prevBtn.disabled = currentFlashcardIndex === 0;
                nextBtn.disabled = currentFlashcardIndex === flashcards.length - 1;
            }

            // --- QUIZ LOGIC ---
            function initQuiz() {
                shuffleArray(quizQuestions);
                currentQuizIndex = 0;
                quizScore = 0;
                quizStreak = 0;
                answerSelected = false;
                quizQuestionContainer.classList.remove('hidden');
                quizResultsContainer.classList.add('hidden');
                nextQuizBtn.classList.remove('hidden');
                quizProgressIndicator.classList.remove('hidden');
                updateStreakDisplay();
                displayQuizQuestion();
            }

            function displayQuizQuestion() {
                answerSelected = false;
                nextQuizBtn.disabled = true;
                const question = quizQuestions[currentQuizIndex];
                quizQuestionText.textContent = question.question;
                quizCodeSnippet.innerHTML = '';
                if (question.code) {
                    const pre = document.createElement('pre');
                    const code = document.createElement('code');
                    code.className = 'java';
                    code.textContent = question.code;
                    pre.appendChild(code);
                    quizCodeSnippet.appendChild(pre);
                    hljs.highlightElement(code);
                }
                quizOptions.innerHTML = '';
                question.options.forEach(option => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.className = 'w-full text-left p-4 rounded-lg bg-slate-700 hover:bg-slate-600/70 transition-colors duration-200';
                    button.addEventListener('click', () => selectAnswer(button, option, question.answer));
                    quizOptions.appendChild(button);
                });
                updateQuizProgress();
            }

            // --- PROGRESS PERSISTENCE ---
            function saveProgress() {
                const masteryStatus = {};
                flashcards.forEach(card => {
                    if (card.mastered) {
                        masteryStatus[card.term] = true;
                    }
                });
                localStorage.setItem('javaStudyHubMastery', JSON.stringify(masteryStatus));
            }

            function loadProgress() {
                const savedMastery = JSON.parse(localStorage.getItem('javaStudyHubMastery'));
                if (savedMastery) {
                    flashcards.forEach(card => {
                        // Reset mastered status first to handle removals
                        card.mastered = false; 
                        if (savedMastery[card.term]) {
                            card.mastered = true;
                        }
                    });
                }
            }
            function selectAnswer(button, selectedOption, correctAnswer) {
                if (answerSelected) return;
                answerSelected = true;
                nextQuizBtn.disabled = false;
                
                const buttons = quizOptions.querySelectorAll('button');
                buttons.forEach(btn => { btn.disabled = true; });

                if (selectedOption === correctAnswer) {
                    quizScore++;
                    quizStreak++;
                    // --- UPGRADED: Streak-aware messages ---
                    if (quizStreak > 0 && quizStreak % 3 === 0) { // Every 3 correct answers
                        showBuddyMessage(`${quizStreak} in a row! On fire!`, "success");
                    } else {
                        showBuddyMessage("Correct!", "success");
                    }
                    button.classList.remove('bg-slate-700');
                    button.classList.add('bg-green-500/50', 'border-2', 'border-green-500', 'pulse');
                } else {
                    quizStreak = 0;
                    showBuddyMessage("Not quite, but good try!", "encourage");
                    button.classList.remove('bg-slate-700');
                    button.classList.add('bg-red-500/50', 'border-2', 'border-red-500', 'shake');
                    // Also highlight the correct answer
                    buttons.forEach(btn => {
                        if (btn.textContent === correctAnswer) {
                            btn.classList.add('bg-green-500/50', 'border-2', 'border-green-500');
                        }
                    });
                }
                updateStreakDisplay();
            }
            
            function updateStreakDisplay() {
                streakCountEl.textContent = quizStreak;
            }

            function updateQuizProgress() {
                quizProgressIndicator.textContent = `${currentQuizIndex + 1} / ${quizQuestions.length}`;
            }
            
            function showQuizResults() {
                quizQuestionContainer.classList.add('hidden');
                quizResultsContainer.classList.remove('hidden');
                nextQuizBtn.classList.add('hidden');
                quizProgressIndicator.classList.add('hidden');
                quizScoreEl.textContent = `${quizScore} / ${quizQuestions.length}`;
                let feedback = "Good effort! Keep practicing.";
                const percentage = (quizScore / quizQuestions.length) * 100;
                if (percentage === 100) {
                    feedback = "Perfect score! You're a Java master!";
                    showBuddyMessage("Amazing! Perfect score!", "success", 4000);
                } else if (percentage >= 75) {
                    feedback = "Excellent work! You know your stuff.";
                     showBuddyMessage("Great job on the quiz!", "success", 4000);
                } else {
                    showBuddyMessage("Practice makes perfect!", "info", 4000);
                }
                quizFeedbackEl.textContent = feedback;
            }

            // --- EVENT LISTENERS ---
            flashcardModeBtn.addEventListener('click', () => switchMode('flashcard'));
            quizModeBtn.addEventListener('click', () => switchMode('quiz'));
            // Add the event listener for your new button
            document.getElementById('reset-btn').addEventListener('click', () => {
                if (confirm("Are you sure you want to reset all your progress?")) {
                    localStorage.removeItem('javaStudyHubMastery');
                    flashcards.forEach(card => card.mastered = false);
                    initFlashcards(); // Re-initialize the view
                    showBuddyMessage("Progress reset!", "info");
                }
            });
            cardContainer.addEventListener('click', () => cardContainer.classList.toggle('flipped'));
            masteryBtn.addEventListener('click', toggleMastery);
            nextBtn.addEventListener('click', (e) => { e.stopPropagation(); if (currentFlashcardIndex < flashcards.length - 1) { currentFlashcardIndex++; updateFlashcard(); } });
            prevBtn.addEventListener('click', (e) => { e.stopPropagation(); if (currentFlashcardIndex > 0) { currentFlashcardIndex--; updateFlashcard(); } });
            nextQuizBtn.addEventListener('click', () => {
                currentQuizIndex++;
                if (currentQuizIndex < quizQuestions.length) {
                    displayQuizQuestion();
                } else {
                    showQuizResults();
                }
            });
            restartQuizBtn.addEventListener('click', initQuiz);
            restartMatchBtn.addEventListener('click', initMatchingGame); 
            studyBuddy.addEventListener('click', () => {
                 const messages = ["Keep going!", "You can do it!", "Java is awesome!", "Almost there!"];
                 const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                 showBuddyMessage(randomMessage);
            });


            // --- KEYBOARD NAVIGATION ---
            document.addEventListener('keydown', (e) => {
                if (currentMode !== 'flashcard') return;
                if (e.key === 'ArrowRight') nextBtn.click();
                if (e.key === 'ArrowLeft') prevBtn.click();
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    cardContainer.click();
                }
            });

            // --- INITIAL LOAD ---
            loadProgress();
            initFlashcards();
            setTimeout(() => {
                showBuddyMessage("Welcome! Ready to study?", "info");
            }, 1000);
        });
    </script>
</body>
</html>
